constrains:
  decay:
    fix_chain_idx: 0
    fix_chain_val: 1
  var_equal:
  - [ a2(1320)p_mass, a2(1320)m_mass ]
  - [ a2(1320)p_width, a2(1320)m_width ]
  var_range:
    a2(1320)p_mass: [ 1.1, 1.5 ]
    a2(1320)p_width: [ 0.001, 0.7]
    a2(1320)m_mass: [ 1.1, 1.5 ]
    a2(1320)m_width: [ 0.001, 0.7]

  fix_var:
    rho_omega_fix1r: 0.0
    rho_omega_fracr: 1.0
    rho_omega_fix1i: 0.0
    rho_omega_fraci: 0.0

plot:
    config:
        nbins: 200
    mass:
        pipi:
            display: "m($\\pi\\pi$)"
        pipeta:
            display: "m($\\pi\\eta$)"
        pimeta:
            display: "m($\\pi\\eta$)"
    angle:
        pipi:
            cos(beta):
                display: "$\\cos\\theta^{\\pi\\pi}$"
            alpha:
                display: "$\\phi^{\\pi\\pi}$"
        pipeta:
            cos(beta):
                display: "$\\cos\\theta^{\\pi^{+}\\eta}$"
            alpha:
                display: "$\\phi^{\\pi^{+}\\eta}$"
        pimeta:
            cos(beta):
                display: "$\\cos\\theta^{\\pi^{+}\\eta}$"
            alpha:
                display: "$\\phi^{\\pi^{+}\\eta}$"
        pipi/pip:
            cos(beta):
                display: "$\\cos\\theta^{\\pi\\pi}_{\\pi}$"
            alpha:
                display: "$\\phi^{\\pi\\pi}_{\\pi}$"
        pipeta/pip:
            cos(beta):
                display: "$\\cos\\theta^{\\pi^{+}\\eta}_{\\pi}$"
            alpha:
                display: "$\\phi^{\\pi^{+}\\eta}_{\\pi}$"
        pimeta/pim:
            cos(beta):
                display: "$\\cos\\theta^{\\pi^{-}\\eta}_{\\pi}$"
            alpha:
                display: "$\\phi^{\\pi^{-}\\eta}_{\\pi}$"
    extra_vars:
        maxpieta:
            expr: "max(m_pipeta,m_pimeta)"
        minpieta:
            expr: "min(m_pipeta,m_pimeta)"
    2Dplot:
        dalitz_1:
            x: m_pipi**2
            y: m_pipeta**2
            add_dalitz_boundary: [pipi, pipeta]
            adaptive_binning: [[2,2],[2,2],[2,2],[2,2]]
            "pull_scatter_style": {"c": "black", "s": 1, "alpha": 0.0}
            plot_figs: [data_hist, fitted, pull]
        dalitz_2:
            x: m_pipeta**2
            y: m_pimeta**2
            adaptive_binning: [[2,2],[2,2],[2,2],[2,2]]
            add_dalitz_boundary: [pipeta, pimeta]
            "pull_scatter_style": {"c": "black", "s": 1, "alpha": 0.0}
            plot_figs: [data_hist, fitted, pull]





