config:
    backend: numpy_pwa

data:
    dat_order: [pip, pim, eta]
    data: ./data_arr.npz

    phsp: ./phsp_arr.npz
    random_z: False
    center_mmass: True

decay:
    jpsi:
    - [pipi, eta]
    - [pipeta, pim]
    - [pimeta, pip]
    pipi: [pip, pim]
    pipeta: [pip, eta]
    pimeta: [pim, eta]

particle:
    $top: jpsi
    $finals: [pip, pim, eta]
    pipi: [ MI0p, MI0m, MI1p, MI1m, MI2p, MI2m, MI3p, MI3m ]
    pipeta: [ ]
    pimeta: [ ]
    jpsi:
        J: 1
        P: -1
        spins: [-1, 1]
        mass: 3.096813522559038
    pip:
        J: 0
        P: -1
        mass: 0.139567
    pim:
        J: 0
        P: -1
        mass: 0.139567
    eta:
        J: 0
        P: -1
        mass: 0.5478621409593663
    testR:
        J: 1
        P: -1
        mass: 0.3
        width: 0.05
        model: BW
        # float: m
    MI0p:
