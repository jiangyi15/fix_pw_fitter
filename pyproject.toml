[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TabPWA"
version = "0.1.0"
description = "Amplitude analysis fitting framework with tabulated/interpolated kernels, TFPWA-compatible"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "cffi",
    "sympy",
    "scipy",
    "matplotlib",
]
dynamic = []

[project.optional-dependencies]
cuda = [
    "cffi",
]
onnx = [
    "onnx",
    "onnxruntime",
]
onnx-gpu = [
    "onnx",
    "onnxruntime-gpu",
]
dev = [
    "pytest",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tabpwa*"]

[tool.setuptools.package-data]
tabpwa = ["cuda/*.cu", "cuda/*.cuh", "cuda/*.hash", "cpu/*.c"]
