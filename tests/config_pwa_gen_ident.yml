# pwa_gen with IDENTICAL PARTICLES only:
#
#   identical_particles: [[pip, pip2]]  -> n_perm = 2, n_cp = 1 -> n_blocks = 2
#
# So every base wave is summed over 2 block orderings, all sharing one `ck`:
#
#     A_{e,p} = Σ_blocks Σ_k ck_k · (F/D)_{e,k} · fa_{e,p,k}
#
# The event data carries one column band per block
# (`build_tree_event_data` concatenates `mass` -> n_blocks·n_topo·n_res,
# `q` -> n_blocks·n_topo·n_decay, `angle` -> n_blocks·n_topo), and
# `build_from_groups` rebases every per-wave index onto its block's band, so
# the wave axis is `n_blocks · n_base` and `len(ck)` matches by construction.
#
# `tests/config_pwa_gen_cp.yml` is the harder variant (identical AND CP on
# the same pair, 4 blocks).
amp_model: pwa_gen
defaults:
  n_interp: 4000
data:
  dat_order: [pip, pip2, eta]
  identical_particles: [[pip, pip2]]
  data: ./data_slice.npy
  phsp: ./phsp_slice.npy
decay:
  jpsi:
    - [pipi, eta]
  pipi: [pip, pip2]
particle:
  $top: jpsi
  $finals: [pip, pip2, eta]
  pipi: [k2]
  jpsi:
    J: 1
    P: -1
    mass: 3.096813522559038
  pip:
    J: 0
    P: -1
    mass: 0.139567
  pip2:
    J: 0
    P: -1
    mass: 0.139567
  eta:
    J: 0
    P: -1
    mass: 0.5478621409593663
  k2:
    J: 1
    P: -1
    mass: 0.80
    model: kmatrix_n
    mass_list: [0.80, 1.35]
    width_list: [0.15, 0.20]
