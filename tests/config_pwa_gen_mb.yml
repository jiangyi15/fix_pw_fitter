# pwa_gen with a TWO-RESONANCE chain (`n_res == 2`) on the `kmatrix_n` basis.
#
# The top decay is widened to three daughters, two of which are resonances:
#
#     jpsi -> pipi + sig + eta ,   pipi -> pip + pim ,   sig -> kp + km
#
# so every wave's denominator is the PRODUCT of two Breit-Wigner factors
# (`bw_{w,0}·bw_{w,1}`, the `cpu_pwa_gen` model).  `pipi` keeps the
# `kmatrix_n` BasisModel basis (5 denominator rows for two poles, numerator
# active with two heads) while `sig` is an ordinary BW (3 rows), so the
# factor layout is also ragged: `off` is per (wave, factor) and
# `n_basis_tot < n_fact·n_basis`.
#
# `n_interp` is raised (as in config_pwa_gen_km.yml) so the tabulated basis
# rows reproduce the closed-form ones to ~1e-7.
amp_model: pwa_gen
defaults:
  n_interp: 20000
data:
  dat_order: [pip, pim, kp, km, eta]
  data: ./data_slice.npy
  phsp: ./phsp_slice.npy
decay:
  jpsi:
    - [pipi, sig, eta]
  pipi: [pip, pim]
  sig: [kp, km]
particle:
  $top: jpsi
  $finals: [pip, pim, kp, km, eta]
  pipi: [k2]
  jpsi:
    J: 1
    P: -1
    mass: 3.096813522559038
  pip:
    J: 0
    P: -1
    mass: 0.139567
  pim:
    J: 0
    P: -1
    mass: 0.139567
  kp:
    J: 0
    P: -1
    mass: 0.493677
  km:
    J: 0
    P: -1
    mass: 0.493677
  eta:
    J: 0
    P: -1
    mass: 0.5478621409593663
  sig:
    J: 0
    P: 1
    mass: 0.5
    width: 0.12
  k2:
    J: 1
    P: -1
    mass: 0.80
    model: kmatrix_n
    mass_list: [0.80, 1.35]
    width_list: [0.15, 0.20]
