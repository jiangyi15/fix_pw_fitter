# pwa_gen with a TWO-RESONANCE chain (`n_res == 2`) on the `kmatrix2` basis.
#
# The top decay is widened to three daughters, two of which are resonances:
#
#     jpsi -> pipi + sig + eta ,   pipi -> pip + pim ,   sig -> kp + km
#
# so every wave's denominator is the PRODUCT of two Breit-Wigner factors
# (`bw_{w,0}·bw_{w,1}`, the `cpu_pwa_gen` model).  `pipi` keeps the
# `kmatrix2` BasisModel basis (5 denominator rows, numerator active) while
# `sig` is an ordinary BW (3 rows), so the factor layout is also ragged:
# `off` is per (wave, factor) and `n_basis_tot < n_fact·n_basis`.
#
# `n_interp` is raised (as in config_pwa_gen_km.yml) so the tabulated basis
# rows reproduce the closed-form ones to ~1e-12.
amp_model: pwa_gen
defaults:
  n_interp: 20000
data:
  dat_order: [pip, pim, kp, km, eta]
  data: ./data_slice.npy
  phsp: ./phsp_slice.npy
decay:
  jpsi:
    - [pipi, sig, eta]
  pipi: [pip, pim]
  sig: [kp, km]
particle:
  $top: jpsi
  $finals: [pip, pim, kp, km, eta]
  pipi: [k2]
  jpsi:
    J: 1
    P: -1
    mass: 3.096813522559038
  pip:
    J: 0
    P: -1
    mass: 0.139567
  pim:
    J: 0
    P: -1
    mass: 0.139567
  kp:
    J: 0
    P: -1
    mass: 0.493677
  km:
    J: 0
    P: -1
    mass: 0.493677
  eta:
    J: 0
    P: -1
    mass: 0.5478621409593663
  sig:
    J: 0
    P: 1
    mass: 0.5
    width: 0.12
  k2:
    J: 1
    P: -1
    mass: 0.80
    width: 0.30
    model: kmatrix2
    m1: 0.80
    m2: 1.35
    g1: 0.35
    g2: 0.55
    b1: 1.0
    b2r: 0.6
    b2i: 0.7
