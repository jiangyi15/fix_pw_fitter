# pwa_gen with a two-pole `kmatrix_n` resonance (the K-matrix family's
# only implementation): one resonance, one partial wave, one projection.
# Gate B: P and the NLL must equal the direct
# `Σ g_ls·(P/(1−iρK))·fa·fl` (tests/test_pwa_gen.py).
# n_interp is raised so the tabulated rows track the closed-form ones closely.
# It is no longer a floor: the tables are read with Catmull-Rom (the kernels'
# scheme), which reproduces the quadratic `-m²` row EXACTLY, so the residue
# against the direct amplitude is ~1e-12 at this setting and was ~1e-7 when the
# reference read the tables two-point linearly.  The override is kept because
# it is still a representation error on the interpolated `num`/`gamma` rows,
# only a much smaller one.
amp_model: pwa_gen
defaults:
  n_interp: 20000
data:
  dat_order: [pip, pim, eta]
  data: ./data_slice.npy
  phsp: ./phsp_slice.npy
decay:
  jpsi:
    - [pipi, eta]
  pipi: [pip, pim]
particle:
  $top: jpsi
  $finals: [pip, pim, eta]
  pipi: [k2]
  jpsi:
    J: 1
    P: -1
    mass: 3.096813522559038
  pip:
    J: 0
    P: -1
    mass: 0.139567
  pim:
    J: 0
    P: -1
    mass: 0.139567
  eta:
    J: 0
    P: -1
    mass: 0.5478621409593663
  k2:
    J: 1
    P: -1
    mass: 0.80
    model: kmatrix_n
    mass_list: [0.80, 1.35]
    width_list: [0.15, 0.20]
