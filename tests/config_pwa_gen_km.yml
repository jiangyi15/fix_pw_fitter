# pwa_gen with a two-pole `kmatrix_n` resonance (the K-matrix family's
# only implementation): one resonance, one partial wave, one projection.
# Gate B: P and the NLL must equal the direct
# `Σ g_ls·(P/(1−iρK))·fa·fl` (tests/test_pwa_gen.py).
# n_interp is raised so the tabulated basis rows reproduce the closed-form
# rows to ~1e-7 (linear interpolation of the flat tables is the only
# approximation left in the chain).
amp_model: pwa_gen
defaults:
  n_interp: 20000
data:
  dat_order: [pip, pim, eta]
  data: ./data_slice.npy
  phsp: ./phsp_slice.npy
decay:
  jpsi:
    - [pipi, eta]
  pipi: [pip, pim]
particle:
  $top: jpsi
  $finals: [pip, pim, eta]
  pipi: [k2]
  jpsi:
    J: 1
    P: -1
    mass: 3.096813522559038
  pip:
    J: 0
    P: -1
    mass: 0.139567
  pim:
    J: 0
    P: -1
    mass: 0.139567
  eta:
    J: 0
    P: -1
    mass: 0.5478621409593663
  k2:
    J: 1
    P: -1
    mass: 0.80
    model: kmatrix_n
    mass_list: [0.80, 1.35]
    width_list: [0.15, 0.20]
